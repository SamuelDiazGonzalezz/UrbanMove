<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UrbanMove · Usuario</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/shared/base.css?v=2">
  <style>
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; align-items: start; }
    .map-panel { padding: 0; height: calc(100vh - 170px); min-height: 460px; position: relative; }
    #map { position: absolute; inset: 0; background: var(--wash); }
    .leaflet-tile-pane { filter: grayscale(1) contrast(0.92) brightness(1.06); }
    .side { scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.4) transparent; }
    .leaflet-container { font-family: var(--sans); }
    .leaflet-control-attribution { font-size: 9px; }
    .pin { background: var(--ink); color: var(--paper); font: 500 10px/1 var(--mono); padding: 4px 5px; border: 1px solid var(--paper); white-space: nowrap; }
    .pin.off { background: var(--paper); color: var(--mute); border-color: var(--faint); }
    .pin.mine { outline: 2px solid var(--ink); outline-offset: 2px; }
    .side { display: flex; flex-direction: column; gap: 16px; max-height: calc(100vh - 170px); overflow: auto; }
    .side .panel + .panel { margin-top: 0; }
    .now .big { margin: 6px 0 4px; }
    .vehicle { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--rule); }
    .vehicle:first-child { border-top: 0; }
    .vehicle.focus { background: var(--wash); margin: 0 -22px; padding: 12px 22px; }
    .vehicle .code { font-family: var(--mono); font-weight: 500; }
    .vehicle .meta { font-size: 12px; color: var(--mute); display: flex; gap: 12px; align-items: center; }
    .vehicle .actions { grid-row: span 2; align-self: center; flex-direction: column; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start; }
    .grid-2 .panel + .panel { margin-top: 0; }
    .timeline li { align-items: flex-start; }
    @media (max-width: 1000px) {
      .layout { grid-template-columns: 1fr; }
      .map-panel { height: 52vh; min-height: 320px; }
      .side { max-height: none; }
    }
  </style>
</head>
<body data-app="usuario">
  <main class="page"></main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/shared/app.js?v=2"></script>
  <script src="/usuario/usuario.js?v=2"></script>
</body>
</html>
