name: CI Pipeline

on:
  push:
    branches: [ main, fase0-skeleton, prototipo1 ]
  pull_request:
    branches: [ main, prototipo1 ]

jobs:
  test:
    name: Build & Test Microservices (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Tests
        env:
          DOCKER_API_VERSION: '1.44'
        run: mvn -B -ntp clean test

  terraform:
    name: Validate Terraform & Cloud Native IaC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python for Lambda Staging
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package Lambdas (Simulate Staging Build)
        run: |
          chmod +x infra/lambdas/build.sh
          ./infra/lambdas/build.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Format Check
        working-directory: infra/terraform
        run: terraform fmt -check -diff

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: infra/terraform
        run: terraform validate

      - name: Terraform Plan (LocalStack Spec Check)
        working-directory: infra/terraform
        env:
          TF_VAR_db_password: "mock_db_password"
          TF_VAR_aws_access_key: "mock_access_key"
          TF_VAR_aws_secret_key: "mock_secret_key"
        run: terraform plan -var-file=environments/local.tfvars -input=false
