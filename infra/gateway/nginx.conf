# Gateway local: sirve las tres interfaces y enruta /api/* al microservicio dueño del recurso.
# /internal/* no se expone: solo lo usan las Lambdas dentro de la red de Docker.
server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 1m;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    # strict-origin-when-cross-origin: OpenStreetMap exige Referer en las peticiones de mosaicos.
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Revalidar siempre: las interfaces se editan sin build y deben verse al recargar.
    add_header Cache-Control no-cache always;

    location ~ ^/internal/ { return 404; }

    location = / { try_files /index.html =404; }
    location /usuario/      { try_files $uri $uri/ /usuario/index.html; }
    location /operaciones/  { try_files $uri $uri/ /operaciones/index.html; }
    location /dashboard/    { try_files $uri $uri/ /dashboard/index.html; }
    location /shared/       { }

    location ~ ^/api/(auth|users)(/|$)           { set $up identity;      proxy_pass http://$up:8080; }
    location ~ ^/api/profiles(/|$)               { set $up user-profiles; proxy_pass http://$up:8080; }
    location ~ ^/api/zones(/|$)                  { set $up zones;         proxy_pass http://$up:8080; }
    location ~ ^/api/vehicles(/|$)               { set $up inventory;     proxy_pass http://$up:8080; }
    location ~ ^/api/availability(/|$)           { set $up availability;  proxy_pass http://$up:8080; }
    location ~ ^/api/telemetry(/|$)              { set $up telemetry;     proxy_pass http://$up:8080; }
    location ~ ^/api/reservations(/|$)           { set $up reservations;  proxy_pass http://$up:8080; }
    location ~ ^/api/rides(/|$)                  { set $up rides;         proxy_pass http://$up:8080; }
    location ~ ^/api/incidents(/|$)              { set $up incidents;     proxy_pass http://$up:8080; }
    location ~ ^/api/maintenance-orders(/|$)     { set $up maintenance;   proxy_pass http://$up:8080; }
    location ~ ^/api/relocation-orders(/|$)      { set $up relocation;    proxy_pass http://$up:8080; }
    location ~ ^/api/history(/|$)                { set $up history;       proxy_pass http://$up:8080; }
    location ~ ^/api/analytics(/|$)              { set $up analytics;     proxy_pass http://$up:8080; }

    location /api/ { return 404 '{"error":"NOT_FOUND","message":"Ruta de API desconocida"}'; }

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_intercept_errors off;

    error_page 502 503 504 = @unavailable;
    location @unavailable {
        default_type application/json;
        return 503 '{"error":"SERVICE_UNAVAILABLE","message":"El servicio no responde todavía. Si acabas de arrancar, espera unos segundos."}';
    }
}
