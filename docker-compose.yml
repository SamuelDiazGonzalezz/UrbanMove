# UrbanMove — plataforma local completa (rama prototipo1).
#   docker compose up -d --build
# Orden: postgres + localstack + keycloak → lambda-build → terraform (bus, reglas, colas, Lambdas)
# → microservicios y gateway. Los servicios esperan a terraform para que los eventos semilla
# encuentren ya sus reglas en EventBridge.

x-service: &service
  build:
    context: .
    dockerfile: services/Dockerfile
  restart: unless-stopped
  mem_limit: 320m
  environment: &service-env
    DB_HOST: postgres
    DB_USER: ${POSTGRES_USER:-urbanmove}
    DB_PASSWORD: ${POSTGRES_PASSWORD:-urbanmove_dev}
    AWS_ENDPOINT_URL: http://localstack:4566
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-1}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/urbanmove/protocol/openid-connect/certs
  depends_on: &service-deps
    postgres:
      condition: service_healthy
    localstack:
      condition: service_healthy
    terraform:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
    interval: 10s
    timeout: 3s
    retries: 20
    start_period: 40s
  networks: [urbanmove-network]

services:
  postgres:
    image: postgres:16-alpine
    container_name: urbanmove-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-urbanmove}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urbanmove_dev}
      POSTGRES_DB: ${POSTGRES_DB:-urbanmove_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/local/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-urbanmove} -d ${POSTGRES_DB:-urbanmove_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [urbanmove-network]

  localstack:
    image: localstack/localstack:3.0
    container_name: urbanmove-localstack
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      SERVICES: s3,sqs,sns,lambda,iam,events,logs,sts
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-1}
      DOCKER_HOST: unix:///var/run/docker.sock
      # Las Lambdas corren en contenedores dentro de la red de la plataforma para llegar a
      # reservations, maintenance y postgres.
      LAMBDA_DOCKER_NETWORK: urbanmove-network
    volumes:
      - localstack_data:/var/lib/localstack
      - ./infra/local/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [urbanmove-network]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: urbanmove-keycloak
    command: ["start-dev", "--import-realm"]
    mem_limit: 900m
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER:-urbanmove}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-urbanmove_dev}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./infra/keycloak/realm-urbanmove.json:/opt/keycloak/data/import/realm-urbanmove.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [urbanmove-network]

  # Empaqueta cada Lambda (código + dependencias) en infra/lambdas/build/. Termina y sale.
  lambda-build:
    image: python:3.11-slim
    container_name: urbanmove-lambda-build
    command: ["sh", "/lambdas/build.sh"]
    volumes:
      - ./infra/lambdas:/lambdas
    restart: "no"

  # Aplica la infraestructura AWS sobre LocalStack. Termina y sale. Si LocalStack se reinició
  # (Community no persiste recursos), el refresh de Terraform detecta lo que falta y lo recrea.
  terraform:
    image: hashicorp/terraform:1.9.8
    container_name: urbanmove-terraform
    working_dir: /infra/terraform
    entrypoint: ["sh", "/infra/terraform/apply.sh"]
    environment:
      TF_VAR_aws_endpoint_url: http://localstack:4566
      TF_VAR_db_user: ${POSTGRES_USER:-urbanmove}
      TF_VAR_db_password: ${POSTGRES_PASSWORD:-urbanmove_dev}
      TF_VAR_reservation_ttl_seconds: ${RESERVATION_TTL_SECONDS:-300}
    volumes:
      - ./infra:/infra
    depends_on:
      localstack: { condition: service_healthy }
      lambda-build: { condition: service_completed_successfully }
    restart: "no"
    networks: [urbanmove-network]

  gateway:
    image: nginx:1.27-alpine
    container_name: urbanmove-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./clients:/usr/share/nginx/html:ro
    networks: [urbanmove-network]

  identity:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: identity } }
    container_name: urbanmove-identity
    environment:
      <<: *service-env
      DB_NAME: identity_db
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    depends_on:
      <<: *service-deps
      keycloak: { condition: service_healthy }

  user-profiles:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: user-profiles } }
    container_name: urbanmove-user-profiles
    environment: { <<: *service-env, DB_NAME: user_profiles_db }

  zones:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: zones } }
    container_name: urbanmove-zones
    environment: { <<: *service-env, DB_NAME: zones_db }

  inventory:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: inventory } }
    container_name: urbanmove-inventory
    environment: { <<: *service-env, DB_NAME: inventory_db }

  availability:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: availability } }
    container_name: urbanmove-availability
    environment: { <<: *service-env, DB_NAME: availability_db }

  telemetry:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: telemetry } }
    container_name: urbanmove-telemetry
    environment: { <<: *service-env, DB_NAME: telemetry_db }

  reservations:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: reservations } }
    container_name: urbanmove-reservations
    environment: { <<: *service-env, DB_NAME: reservations_db, RESERVATION_TTL_SECONDS: "${RESERVATION_TTL_SECONDS:-300}" }

  rides:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: rides } }
    container_name: urbanmove-rides
    environment: { <<: *service-env, DB_NAME: rides_db }

  incidents:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: incidents } }
    container_name: urbanmove-incidents
    environment: { <<: *service-env, DB_NAME: incidents_db }

  maintenance:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: maintenance } }
    container_name: urbanmove-maintenance
    environment: { <<: *service-env, DB_NAME: maintenance_db, MAINTENANCE_USAGE_LIMIT: "${MAINTENANCE_USAGE_LIMIT:-10}" }

  relocation:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: relocation } }
    container_name: urbanmove-relocation
    environment: { <<: *service-env, DB_NAME: relocation_db }

  history:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: history } }
    container_name: urbanmove-history
    environment: { <<: *service-env, DB_NAME: history_db }

  analytics:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: analytics } }
    container_name: urbanmove-analytics
    environment: { <<: *service-env, DB_NAME: analytics_db }

volumes:
  pgdata:
  localstack_data:

networks:
  urbanmove-network:
    name: urbanmove-network
    driver: bridge
