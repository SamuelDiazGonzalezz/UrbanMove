services:
  postgres:
    image: postgres:16-alpine
    container_name: urbanmove-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-urbanmove}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-urbanmove_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/local/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-urbanmove} -d ${POSTGRES_DB:-urbanmove_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - urbanmove-network

  localstack:
    image: localstack/localstack:3.0
    container_name: urbanmove-localstack
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      - SERVICES=s3,sqs,sns,lambda,iam
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-eu-west-1}
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - localstack_data:/var/lib/localstack
      - ./infra/local/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
      - ./infra/lambdas:/infra/lambdas:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - urbanmove-network

  core-fleet:
    build:
      context: .
      dockerfile: services/core-fleet/Dockerfile
    container_name: urbanmove-core-fleet
    ports:
      - "${CORE_FLEET_PORT:-8080}:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${CORE_FLEET_DB_NAME:-availability_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-urbanmove}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-eu-west-1}
      - SQS_QUEUE_URL=http://sqs.${AWS_DEFAULT_REGION:-eu-west-1}.localhost.localstack.cloud:4566/000000000000/${SQS_TRIP_RECORDED_QUEUE:-trip-recorded-queue}
      - S3_DATALAKE_BUCKET=${S3_DATALAKE_BUCKET:-urbanmove-data-lake}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - urbanmove-network

volumes:
  postgres_data:
  localstack_data:

networks:
  urbanmove-network:
    name: urbanmove-network
    driver: bridge
