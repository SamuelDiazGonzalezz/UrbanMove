# Configuración compartida por todos los microservicios. Cada servicio la importa con
# spring.config.import y solo define su nombre, su base de datos y su cola.
server:
  port: 8080
  shutdown: graceful

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER:urbanmove}
    password: ${DB_PASSWORD:urbanmove}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
  flyway:
    locations: classpath:db/common,classpath:db/migration
    baseline-on-migrate: true
  task:
    scheduling:
      pool:
        size: 3
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://keycloak:8080/realms/urbanmove/protocol/openid-connect/certs}
  main:
    banner-mode: off

urbanmove:
  aws:
    endpoint: ${AWS_ENDPOINT_URL:http://localstack:4566}
    region: ${AWS_DEFAULT_REGION:eu-west-1}
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  events:
    bus-name: ${EVENT_BUS_NAME:urbanmove-bus}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{24} - %msg%n"
  level:
    software.amazon.awssdk: WARN
